<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Information Form</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 32px 16px;
      background: #f5f5f5;
      color: #222;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 15px;
      line-height: 1.5;
    }

    .page {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
    }

    .brand {
      margin: 0 0 22px;
    }

    .brand-mark { display: none; }

    .brand h1 {
      margin: 0 0 5px;
      font-size: 27px;
      font-weight: 600;
      color: #222;
    }

    .brand p {
      margin: 0;
      color: #666;
      font-size: 14px;
    }

    .card {
      padding: 26px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
    }

    .card-heading {
      margin: 0 0 4px;
      font-size: 19px;
      font-weight: 600;
    }

    .card-subtitle {
      margin: 0 0 22px;
      color: #666;
      font-size: 13px;
    }

    .field { margin-bottom: 18px; }

    label, legend {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 600;
    }

    .required { color: #b42318; }

    input[type="text"], input[type="date"], select {
      width: 100%;
      min-height: 42px;
      padding: 10px 11px;
      border: 1px solid #cfcfcf;
      border-radius: 4px;
      background: #fff;
      color: #222;
      font: inherit;
      font-size: 14px;
    }

    input:focus, select:focus {
      outline: 2px solid #b8c9e8;
      outline-offset: 1px;
      border-color: #5578b8;
    }

    fieldset {
      margin: 0 0 18px;
      padding: 0;
      border: 0;
      min-width: 0;
    }

    .gender-options {
      display: flex;
      gap: 22px;
    }

    .gender-option {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin: 0;
      font-size: 14px;
      font-weight: 400;
      cursor: pointer;
    }

    .gender-option input {
      margin: 0;
      accent-color: #315b9a;
    }

    .submit-btn {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #315b9a;
      border-radius: 4px;
      background: #315b9a;
      color: white;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    .submit-btn:hover { background: #284b80; }

    .privacy-note {
      margin: 12px 0 0;
      color: #777;
      font-size: 12px;
      line-height: 1.5;
    }

    dialog {
      width: min(92vw, 460px);
      padding: 0;
      border: 1px solid #ddd;
      border-radius: 6px;
      color: #222;
      box-shadow: 0 12px 40px rgba(0, 0, 0, .18);
    }

    dialog::backdrop { background: rgba(0, 0, 0, .4); }

    .dialog-content { padding: 25px; }

    .success-icon { display: none; }

    .dialog-content h2 {
      margin: 0 0 5px;
      font-size: 21px;
      font-weight: 600;
    }

    .dialog-content > p {
      margin: 0 0 18px;
      color: #666;
      font-size: 14px;
    }

    .summary { margin: 0 0 22px; }

    .summary-row {
      display: grid;
      grid-template-columns: 135px 1fr;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .summary-row dt { color: #666; }
    .summary-row dd { margin: 0; font-weight: 600; }

    .dialog-actions { display: flex; gap: 10px; }

    .dialog-actions button {
      flex: 1;
      padding: 10px 12px;
      border-radius: 4px;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .close-btn {
      background: #315b9a;
      border: 1px solid #315b9a;
      color: white;
    }

    .edit-btn {
      background: white;
      border: 1px solid #ccc;
      color: #222;
    }

    @media (max-width: 480px) {
      body { padding: 22px 12px; }
      .card { padding: 20px; }
      .summary-row { grid-template-columns: 1fr; gap: 3px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="brand">
      
      <h1>Student Information</h1>
      <p>Complete the form below to submit your student details.</p>
    </header>

    <section class="card" aria-labelledby="form-heading">
      <h2 class="card-heading" id="form-heading">Student registration form</h2>
      <p class="card-subtitle">Fields marked with <span class="required">*</span> are required.</p>

      <form id="studentForm">
        <div class="field">
          <label for="studentName">Student name <span class="required">*</span></label>
          <input type="text" id="studentName" name="studentName" placeholder="Enter your full name" autocomplete="name" required>
        </div>

        <div class="field">
          <label for="registrationNumber">Registration number <span class="required">*</span></label>
          <input type="text" id="registrationNumber" name="registrationNumber" placeholder="e.g. 23BCE12345" required>
        </div>

        <div class="field">
          <label for="dob">Date of birth <span class="required">*</span></label>
          <input type="date" id="dob" name="dob" required>
        </div>

        <fieldset>
          <legend>Gender <span class="required">*</span></legend>
          <div class="gender-options">
            <label class="gender-option"><input type="radio" name="gender" value="Male" required> Male</label>
            <label class="gender-option"><input type="radio" name="gender" value="Female" required> Female</label>
          </div>
        </fieldset>

        <div class="field">
          <label for="program">Select program <span class="required">*</span></label>
          <select id="program" name="program" required>
            <option value="" disabled selected>Choose a VIT Bhopal program</option>
            <optgroup label="B.Tech - Undergraduate Engineering">
              <option>B.Tech - Aerospace Engineering</option>
              <option>B.Tech - Bioengineering</option>
              <option>B.Tech - Computer Science and Engineering</option>
              <option>B.Tech - Computer Science and Engineering (Artificial Intelligence and Machine Learning)</option>
              <option>B.Tech - Computer Science and Engineering (Cyber Security and Digital Forensics)</option>
              <option>B.Tech - Computer Science and Engineering (Cloud Computing and Automation)</option>
              <option>B.Tech - Computer Science and Engineering (E-Commerce Technology)</option>
              <option>B.Tech - Computer Science and Engineering (Education Technology)</option>
              <option>B.Tech - Computer Science and Engineering (Gaming Technology)</option>
              <option>B.Tech - Computer Science and Engineering (Health Informatics)</option>
              <option>B.Tech - Electronics and Communication Engineering</option>
              <option>B.Tech - Electronics and Communication Engineering (Artificial Intelligence and Cybernetics)</option>
              <option>B.Tech - Mechanical Engineering</option>
              <option>B.Tech - Mechanical Engineering (Artificial Intelligence and Robotics)</option>
            </optgroup>
            <optgroup label="Other Undergraduate Programs">
              <option>B.Arch - Bachelor of Architecture</option>
              <option>BBA - Bachelor of Business Administration</option>
            </optgroup>
            <optgroup label="Integrated M.Tech - 5 Year Programs">
              <option>Integrated M.Tech - Artificial Intelligence</option>
              <option>Integrated M.Tech - Computer Science and Engineering (Cyber Security)</option>
              <option>Integrated M.Tech - Computer Science and Engineering (Computational and Data Science)</option>
              <option>Integrated M.Tech - AI and Bioinformatics</option>
            </optgroup>
            <optgroup label="Postgraduate Programs">
              <option>M.Tech - Artificial Intelligence and Data Science</option>
              <option>M.Tech - Computer Science and Engineering (Cyber Security and Digital Forensics)</option>
              <option>M.Tech - VLSI Design</option>
              <option>MCA - Master of Computer Applications</option>
              <option>MBA - Master of Business Administration</option>
            </optgroup>
            <optgroup label="Research Programs">
              <option>Ph.D. - Research Programme</option>
            </optgroup>
          </select>
        </div>

        <button class="submit-btn" type="submit">Submit</button>
        <p class="privacy-note">Please check your details before submitting.</p>
      </form>
    </section>
  </main>

  <dialog id="resultDialog" aria-labelledby="dialogTitle">
    <div class="dialog-content">
      <div class="success-icon" aria-hidden="true">✓</div>
      <h2 id="dialogTitle">Form submitted!</h2>
      <p>Here are the student details you entered.</p>
      <dl class="summary" id="summary"></dl>
      <div class="dialog-actions">
        <button class="edit-btn" type="button" id="editBtn">Edit details</button>
        <button class="close-btn" type="button" id="closeBtn">Done</button>
      </div>
    </div>
  </dialog>

  <script>
    const form = document.getElementById('studentForm');
    const dialog = document.getElementById('resultDialog');
    const summary = document.getElementById('summary');

    // Prevent selecting a future date of birth.
    document.getElementById('dob').max = new Date().toISOString().split('T')[0];

    form.addEventListener('submit', function (event) {
      event.preventDefault();

      const data = new FormData(form);
      const dobValue = data.get('dob');
      const dob = dobValue
        ? new Date(dobValue + 'T00:00:00').toLocaleDateString('en-IN', {
            day: '2-digit', month: 'long', year: 'numeric'
          })
        : '';

      const details = [
        ['Student name', data.get('studentName')],
        ['Registration no.', data.get('registrationNumber')],
        ['Date of birth', dob],
        ['Gender', data.get('gender')],
        ['Program', data.get('program')]
      ];

      summary.replaceChildren();
      details.forEach(([label, value]) => {
        const row = document.createElement('div');
        row.className = 'summary-row';
        const term = document.createElement('dt');
        term.textContent = label;
        const description = document.createElement('dd');
        description.textContent = value;
        row.append(term, description);
        summary.appendChild(row);
      });

      dialog.showModal();
    });

    document.getElementById('closeBtn').addEventListener('click', () => dialog.close());
    document.getElementById('editBtn').addEventListener('click', () => {
      dialog.close();
      document.getElementById('studentName').focus();
    });
  </script>
</body>
</html>
